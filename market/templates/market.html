{% extends 'base.html' %}

{% block title %}
    Market - Wearly
{% endblock %}

{% block content %}
<style>
  .container {
    max-width: 1100px;
    margin-top: 60px;
    margin-bottom: 80px;
  }
  h2.text-center {
    font-weight: 700;
    color: black;
    margin-bottom: 50px;
  }

  /* Filters */
  .filters-row {
    margin-bottom: 30px;
  }

  .form-control,
  .form-select {
    border: 2px solid #ceadae;
    border-radius: 8px;
    padding: 10px 15px;
    font-size: 1rem;
    background: white;
    color: black;
    transition: border-color 0.3s ease;
  }
  .form-control:focus,
  .form-select:focus {
    border-color: #ceadae;
    outline: none;
    box-shadow: 0 0 8px rgba(206, 173, 174, 0.5);
  }

  .btn-outline-primary {
    border-color: #ceadae;
    color: black;
    font-weight: 600;
    border-radius: 10px;
    padding: 10px 20px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .btn-outline-primary:hover {
    background-color: #ceadae;
    color: black;
  }

  /* Products Grid */
  .product-card {
    border: 1.5px solid #ceadae;
    border-radius: 12px;
    transition: box-shadow 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    background: white;
  }
  .product-card:hover {
    box-shadow: 0 8px 20px rgba(206, 173, 174, 0.4);
  }
  .product-card img {
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    height: 250px;
    object-fit: cover;
  }
  .card-body {
    padding: 20px;
    color: black;
  }
  .card-title {
    font-weight: 700;
    font-size: 1.25rem;
    margin-bottom: 10px;
    color: black;
  }
  .card-text {
    font-size: 0.9rem;
    color: #555;
    min-height: 48px;
  }
  .fw-bold {
    color: black;
    font-weight: 700;
    font-size: 1.15rem;
    margin-top: 10px;
    margin-bottom: 15px;
  }
  form button.btn-primary {
    background-color: black;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    padding: 10px;
    color: white;
    transition: background-color 0.3s ease;
  }
  form button.btn-primary:hover {
    background-color: #333333;
  }
</style>

<div class="container">
    <h2 class="text-center">Shop the Latest</h2>

    <!-- Filters -->
    <div class="row filters-row align-items-center">
        <div class="col-md-6 mb-3 mb-md-0">
            <input type="text" class="form-control" placeholder="Search for products...">
        </div>
        <div class="col-md-3 mb-3 mb-md-0">
            <select class="form-select" aria-label="Sort products">
                <option selected>Sort by</option>
                <option value="1">Price: Low to High</option>
                <option value="2">Price: High to Low</option>
            </select>
        </div>
        <div class="col-md-3 text-md-end text-center">
            <a href="{{ url_for('cart_page') }}" class="btn btn-outline-primary">
                <i class="fas fa-shopping-cart me-2"></i> View Cart
            </a>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card product-card h-100">
                <img src="{{ url_for('static', filename='images/' + product.image_filename) }}" class="card-img-top" alt="{{ product.name }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <p class="fw-bold">Rs.{{ product.price }}</p>
                    <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}" class="mt-auto">
                        <button type="submit" class="btn btn-primary w-100">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
