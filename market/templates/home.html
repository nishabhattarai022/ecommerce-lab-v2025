{% extends 'base.html' %}

{% block title %}
    Welcome to wearly
{% endblock %}

{% block content %}
    <!-- Hero Section -->
    <div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center" style="background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #f8f9fa;">
        <div class="col-md-8 p-lg-5 mx-auto my-5">
            <h1 class="display-3 font-weight-bold" style="font-family: 'Playfair Display', serif;"> WEARLY</h1>
            <p class="lead font-italic" style="font-family: 'Poppins', sans-serif;">Your style, your story – shop the latest trends in fashion.</p>
            <a class="btn btn-light btn-lg mt-3 shadow" href="{{ url_for('market_page') }}" style="font-weight: bold; letter-spacing: 1px;">
                Explore Collection
            </a>
        </div>
        <div class="product-device box-shadow d-none d-md-block"></div>
        <div class="product-device product-device-2 box-shadow d-none d-md-block"></div>
    </div>

    <!-- Image Section -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-10 text-center">

                <p class="mt-3 text-muted" style="font-family: 'Poppins', sans-serif;">Discover elegant, everyday wear and exclusive collections curated just for you.</p>
            </div>
        </div>
    </div>
{% endblock %}
